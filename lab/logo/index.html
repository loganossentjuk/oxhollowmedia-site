<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Lab: Logo | Ox Hollow Media</title>
<link rel="icon" href="/images/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --green: #294132; --paper: #F4EEE2; --clay: #B67C56; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--green); color: var(--paper); font-family: var(--sans); overflow: hidden; }

  /* the stage: the mark sits dead centre and is the first o of HOLLOW */
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .lock { position: relative; width: 100vw; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-family: var(--serif); font-weight: 500; text-transform: uppercase;
    font-size: clamp(2.2rem, 7.4vw, 6.4rem); letter-spacing: .12em; line-height: 1; white-space: nowrap; }
  .side { display: flex; overflow: hidden; }
  .side--left { justify-content: flex-end; justify-self: end; }
  .side--right { justify-self: start; }
  .side span { display: inline-block; }
  .mark { width: .74em; height: .74em; flex: none; margin: 0 .12em 0 .02em; overflow: visible; position: relative; z-index: 2; }
  .mark .ring { stroke-dasharray: 1; stroke-dashoffset: 1; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .mark .moon { opacity: 0; }

  /* controls for playing with it */
  .panel { position: fixed; left: 50%; bottom: 1.6rem; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem;
    padding: .4rem; border-radius: 999px; background: rgba(0,0,0,.25); backdrop-filter: blur(8px); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
  .panel button { border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; padding: .65rem 1rem; border-radius: 999px; cursor: pointer; }
  .panel button[aria-pressed="true"] { background: var(--paper); color: var(--green); }
  .panel .sep { width: 1px; background: rgba(244,238,226,.25); margin: .3rem .2rem; }
  .note { position: fixed; top: 1.6rem; left: 50%; transform: translateX(-50%); font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; opacity: .55; text-align: center; }
  @media (max-width: 600px) { .panel { left: 1rem; right: 1rem; transform: none; border-radius: 18px; } .panel .sep { display: none; } }
</style>
</head>
<body>
<p class="note">Logo lab · the mark is the first O of HOLLOW</p>
<div class="stage">
  <div class="lock" aria-label="Ox Hollow">
    <div class="side side--left"><span>O</span><span>X</span><span>&nbsp;</span><span>H</span></div>
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring" cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4.7" pathLength="1"/><path class="moon" d="M27.25,17.1 A40,40 0 0 0 27.25,82.9 Z" fill="currentColor"/></svg>
    <div class="side side--right"><span>L</span><span>L</span><span>O</span><span>W</span></div>
  </div>
</div>
<div class="panel" role="group" aria-label="Playground">
  <button data-v="unroll" aria-pressed="true">Unroll</button>
  <button data-v="fly">Fly out</button>
  <button data-v="split">Split</button>
  <span class="sep"></span>
  <button data-s=".6">Slow</button>
  <button data-s="1" aria-pressed="true">Normal</button>
  <button data-s="1.5">Quick</button>
  <span class="sep"></span>
  <button class="replay">Replay</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const left = document.querySelector('.side--left'), right = document.querySelector('.side--right');
const mark = document.querySelector('.mark'), ring = mark.querySelector('.ring'), moon = mark.querySelector('.moon');
const lettersL = [...left.children], lettersR = [...right.children];
let variant = 'unroll', speed = 1, tl;

function reset() {
  if (tl) tl.kill();
  gsap.set([left, right], { clearProps: 'width' });
  gsap.set([...lettersL, ...lettersR], { clearProps: 'all' });
  gsap.set(ring, { strokeDashoffset: 1 }); gsap.set(moon, { opacity: 0 });
  gsap.set(mark, { scale: 2.4, transformOrigin: '50% 50%' });
}

function play() {
  reset();
  const wl = left.scrollWidth, wr = right.scrollWidth;
  tl = gsap.timeline({ defaults: { ease: 'expo.inOut' } }).timeScale(speed);
  // 1. the mark draws itself, large, in the centre
  tl.to(ring, { strokeDashoffset: 0, duration: .75, ease: 'power2.inOut' })
    .to(moon, { opacity: 1, duration: .35, ease: 'power1.out' }, '-=.2');

  if (variant === 'unroll') {
    // 2. it shrinks to letter size and the name unrolls out of it, both ways at once
    gsap.set([left, right], { width: 0 });
    tl.to(mark, { scale: 1, duration: .95 }, '+=.05')
      .fromTo(left, { width: 0 }, { width: wl, duration: 1.05 }, '<+.12')
      .fromTo(right, { width: 0 }, { width: wr, duration: 1.05 }, '<');
  }

  if (variant === 'fly') {
    // 2. each letter leaves the mark and flies out to its place, nearest first
    const m = mark.getBoundingClientRect(), cx = m.left + m.width / 2;
    const from = el => { const r = el.getBoundingClientRect(); return cx - (r.left + r.width / 2); };
    gsap.set([...lettersL, ...lettersR], { x: i => 0, opacity: 0 });
    [...lettersL, ...lettersR].forEach(el => gsap.set(el, { x: from(el), scale: .4 }));
    tl.to(mark, { scale: 1, duration: .9 }, '+=.05')
      .to([...lettersL].reverse(), { x: 0, scale: 1, opacity: 1, duration: .9, ease: 'expo.out', stagger: .07 }, '<+.25')
      .to(lettersR, { x: 0, scale: 1, opacity: 1, duration: .9, ease: 'expo.out', stagger: .07 }, '<');
  }

  if (variant === 'split') {
    // 2. the mark holds big, then splits the word open like a curtain from its centre, settling small
    gsap.set([left, right], { width: 0 });
    gsap.set([...lettersL, ...lettersR], { yPercent: 110 });
    tl.fromTo(left, { width: 0 }, { width: wl, duration: 1.1 }, '+=.15')
      .fromTo(right, { width: 0 }, { width: wr, duration: 1.1 }, '<')
      .to(mark, { scale: 1, duration: 1.1 }, '<')
      .to([...lettersL].reverse(), { yPercent: 0, duration: .8, ease: 'expo.out', stagger: .05 }, '<+.35')
      .to(lettersR, { yPercent: 0, duration: .8, ease: 'expo.out', stagger: .05 }, '<');
  }
}

document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
  variant = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); play();
}));
document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', x === b)); play();
}));
document.querySelector('.replay').addEventListener('click', play);
document.fonts.ready.then(play);
</script>
</body>
</html>
